name: get_top_marks_with_shiksha_setu
description: "Shiksha Setu — bilingual (Hindi+English) study app with search, voice input, offline PDFs, bookmarks."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  dio: ^5.5.0+1
  speech_to_text: ^6.6.0
  flutter_pdfview: ^1.3.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png
    - assets/pdfs/placeholder.pdf
    - assets/data/subjects.json
